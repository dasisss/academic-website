[build]
  command = "wget -qO quarto.deb https://github.com/quarto-dev/quarto-cli/releases/download/v${QUARTO_VERSION}/quarto-${QUARTO_VERSION}-linux-amd64.deb && dpkg -x quarto.deb quarto-dir && export PATH=$PATH:$(pwd)/quarto-dir/opt/quarto/bin && quarto render"
  publish = "_site"

[build.environment]
  QUARTO_VERSION = "1.8.26"
